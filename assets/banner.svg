<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Saurabh Jaiswar — Software Engineer, agentic AI systems">
  <title>Saurabh Jaiswar — Software Engineer, agentic AI systems</title>

  <defs>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFC94A"/>
      <stop offset="55%" stop-color="#FFB000"/>
      <stop offset="100%" stop-color="#FF7A18"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#2A211A" stroke-width="1"/>
    </pattern>
    <radialGradient id="bloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF7A18" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#FF7A18" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <mask id="typeMask">
      <rect class="typer" x="56" y="40" width="600" height="26" fill="#fff"/>
    </mask>
    <clipPath id="frame"><rect x="0" y="0" width="1200" height="320" rx="16"/></clipPath>
  </defs>

  <style>
    .mono { font-family: "JetBrains Mono","IBM Plex Mono","SFMono-Regular",Consolas,"Liberation Mono",monospace; }
    .amber { fill:#FFB000; } .ember { fill:#FF7A18; } .bone { fill:#F0E2CC; } .dim { fill:#8A7A66; }

    @keyframes type   { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes rise   { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform: translateY(0); } }
    @keyframes fade   { from { opacity:0; } to { opacity:1; } }
    @keyframes blink  { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
    @keyframes flow   { to { stroke-dashoffset: -160; } }
    @keyframes halo   { 0% { transform: scale(1); opacity:.55; } 100% { transform: scale(2.6); opacity:0; } }
    @keyframes spin   { to { transform: rotate(360deg); } }
    @keyframes breathe{ 0%,100% { opacity:.85; } 50% { opacity:.35; } }

    .typer { transform-box: fill-box; transform-origin: left center; animation: type 1.1s steps(28,end) both; }
    .l2 { animation: rise .5s ease-out 1.15s both; }
    .l3 { animation: rise .5s ease-out 1.45s both; }
    .nm { animation: rise .7s cubic-bezier(.2,.7,.2,1) 1.75s both; }
    .l4 { animation: rise .5s ease-out 2.15s both; }
    .l5 { animation: rise .5s ease-out 2.35s both; }
    .caret { animation: blink 1.1s steps(1) 2.6s infinite; }
    .mesh  { animation: fade .9s ease-out 1.9s both; }
    .wire  { stroke:#FF7A18; stroke-width:1.4; stroke-opacity:.55; stroke-dasharray:5 7; animation: flow 3.4s linear infinite; }
    .ring  { animation: spin 26s linear infinite; transform-origin: 950px 160px; }
    .ring2 { animation: spin 34s linear infinite reverse; transform-origin: 950px 160px; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: halo 3s ease-out infinite; }
    .glowdot { animation: breathe 2.6s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .typer,.l2,.l3,.nm,.l4,.l5,.caret,.mesh,.wire,.ring,.ring2,.pulse,.glowdot { animation: none; }
      .typer { transform: none; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="#0F0D0B"/>
    <rect width="1200" height="320" fill="url(#grid)" opacity="0.55"/>
    <ellipse cx="1010" cy="120" rx="330" ry="240" fill="url(#bloom)"/>
    <rect x="0" y="0" width="1200" height="320" fill="none" stroke="#2A211A" stroke-width="2" rx="16"/>
    <rect x="0" y="0" width="4" height="320" class="ember" opacity="0.8"/>

    <g class="mono" font-size="15">
      <g mask="url(#typeMask)">
        <text x="56" y="58"><tspan class="ember">saurabh@github</tspan><tspan class="dim">:~$ </tspan><tspan class="bone">./boot --profile</tspan></text>
      </g>
      <text x="56" y="86" class="l2 dim">▸ mounting /experience .......... <tspan class="amber">ok</tspan></text>
      <text x="56" y="110" class="l3 dim">▸ linking 15+ agents ............ <tspan class="amber">ok</tspan></text>
    </g>

    <g class="nm">
      <text x="56" y="192" class="mono" font-size="52" font-weight="700" letter-spacing="3" fill="url(#nameGrad)" opacity="0.25" filter="url(#soft)">SAURABH</text>
      <text x="56" y="192" class="mono" font-size="52" font-weight="700" letter-spacing="3" fill="url(#nameGrad)">SAURABH</text>
      <text x="56" y="242" class="mono bone" font-size="26" font-weight="500" letter-spacing="8">JAISWAR</text>
    </g>

    <g class="mono" font-size="14">
      <text x="56" y="276" class="l4"><tspan class="amber">Software Engineer</tspan><tspan class="dim">  ·  </tspan><tspan class="bone">agentic AI · RAG · full-stack</tspan></text>
      <text x="56" y="298" class="l5 dim">ICPC Regionalist · Codeforces Expert · LeetCode Guardian <tspan class="caret amber">▮</tspan></text>
    </g>

    <g class="mesh">
      <g class="ring"><circle cx="950" cy="160" r="128" fill="none" stroke="#FFB000" stroke-opacity=".16" stroke-width="1" stroke-dasharray="2 10"/></g>
      <g class="ring2"><circle cx="950" cy="160" r="105" fill="none" stroke="#FF7A18" stroke-opacity=".22" stroke-width="1" stroke-dasharray="14 9"/></g>

      <g>
        <line class="wire" x1="950" y1="160" x2="1055" y2="160"/>
        <line class="wire" x1="950" y1="160" x2="1002" y2="69"/>
        <line class="wire" x1="950" y1="160" x2="898" y2="69"/>
        <line class="wire" x1="950" y1="160" x2="845" y2="160"/>
        <line class="wire" x1="950" y1="160" x2="898" y2="251"/>
        <line class="wire" x1="950" y1="160" x2="1002" y2="251"/>
      </g>

      <g>
        <circle class="pulse" cx="1055" cy="160" r="15" fill="#FF7A18" style="animation-delay:0s"/>
        <circle class="pulse" cx="1002" cy="69"  r="15" fill="#FFB000" style="animation-delay:.5s"/>
        <circle class="pulse" cx="898"  cy="69"  r="15" fill="#FF7A18" style="animation-delay:1s"/>
        <circle class="pulse" cx="845"  cy="160" r="15" fill="#FFB000" style="animation-delay:1.5s"/>
        <circle class="pulse" cx="898"  cy="251" r="15" fill="#FF7A18" style="animation-delay:2s"/>
        <circle class="pulse" cx="1002" cy="251" r="15" fill="#FFB000" style="animation-delay:2.5s"/>
      </g>

      <g class="mono" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="0.5">
        <circle cx="1055" cy="160" r="16" fill="#17130F" stroke="#FF7A18" stroke-width="1.4"/><text x="1055" y="163" class="ember">RAG</text>
        <circle cx="1002" cy="69" r="16" fill="#17130F" stroke="#FFB000" stroke-width="1.4"/><text x="1002" y="72" class="amber">MCP</text>
        <circle cx="898" cy="69" r="16" fill="#17130F" stroke="#FF7A18" stroke-width="1.4"/><text x="898" y="72" class="ember">LLM</text>
        <circle cx="845" cy="160" r="16" fill="#17130F" stroke="#FFB000" stroke-width="1.4"/><text x="845" y="163" class="amber">VDB</text>
        <circle cx="898" cy="251" r="16" fill="#17130F" stroke="#FF7A18" stroke-width="1.4"/><text x="898" y="254" class="ember">API</text>
        <circle cx="1002" cy="251" r="16" fill="#17130F" stroke="#FFB000" stroke-width="1.4"/><text x="1002" y="254" class="amber">OBS</text>
      </g>

      <circle class="glowdot" cx="950" cy="160" r="34" fill="#FF7A18" opacity=".18" filter="url(#soft)"/>
      <circle cx="950" cy="160" r="27" fill="#17130F" stroke="#FFB000" stroke-width="2"/>
      <text x="950" y="157" class="mono amber" font-size="10" font-weight="700" text-anchor="middle">LANG</text>
      <text x="950" y="169" class="mono amber" font-size="10" font-weight="700" text-anchor="middle">GRAPH</text>
      <text x="950" y="308" class="mono dim" font-size="10" text-anchor="middle" letter-spacing="3">ORCHESTRATION LAYER</text>
    </g>
  </g>
</svg>
