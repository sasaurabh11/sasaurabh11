<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="How I build: ingest, parse, embed, index, retrieve, orchestrate, ship">
  <title>Build pipeline</title>

  <defs>
    <pattern id="gridP" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#2A211A" stroke-width="1"/>
    </pattern>
    <radialGradient id="bloomP" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF7A18" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FF7A18" stop-opacity="0"/>
    </radialGradient>
    <filter id="dotGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <clipPath id="frameP"><rect width="1200" height="220" rx="16"/></clipPath>
  </defs>

  <style>
    .mono { font-family: "JetBrains Mono","IBM Plex Mono","SFMono-Regular",Consolas,monospace; }
    .amber { fill:#FFB000; } .ember { fill:#FF7A18; } .bone { fill:#F0E2CC; } .dim { fill:#8A7A66; }
    .box { fill:#12100D; stroke:#3A2E22; stroke-width:1.5; }
    .wire2 { stroke:#FF7A18; stroke-opacity:.5; stroke-width:1.4; stroke-dasharray:4 6; animation: flow2 2.2s linear infinite; }

    @keyframes flow2 { to { stroke-dashoffset: -100; } }
    @keyframes travel { 0% { transform: translateX(0); } 100% { transform: translateX(1090px); } }
    @keyframes hit { 0% { stroke:#3A2E22; } 3% { stroke:#FFB000; } 14% { stroke:#3A2E22; } 100% { stroke:#3A2E22; } }
    @keyframes blink2 { 0%,49%{opacity:1} 50%,100%{opacity:0} }

    .packet { animation: travel 7s linear infinite; }
    .box { animation: hit 7s linear infinite; }
    .s1{animation-delay:.36s} .s2{animation-delay:1.4s} .s3{animation-delay:2.45s} .s4{animation-delay:3.5s}
    .s5{animation-delay:4.55s} .s6{animation-delay:5.6s} .s7{animation-delay:6.65s}
    .cur { animation: blink2 1.1s steps(1) infinite; }
    @media (prefers-reduced-motion: reduce){ .packet,.box,.wire2,.cur{animation:none} .packet{opacity:0} }
  </style>

  <g clip-path="url(#frameP)">
    <rect width="1200" height="220" fill="#0F0D0B"/>
    <rect width="1200" height="220" fill="url(#gridP)" opacity="0.55"/>
    <ellipse cx="600" cy="120" rx="420" ry="200" fill="url(#bloomP)"/>
    <rect width="1200" height="220" fill="none" stroke="#2A211A" stroke-width="2" rx="16"/>
    <rect x="0" y="0" width="4" height="220" class="ember" opacity="0.8"/>

    <text x="40" y="44" class="mono" font-size="15"><tspan class="dim">~$ </tspan><tspan class="bone">cat how-i-build.txt</tspan><tspan class="amber cur"> ▮</tspan></text>

    <g class="wire2">
      <line x1="180" y1="120" x2="210" y2="120"/>
      <line x1="340" y1="120" x2="370" y2="120"/>
      <line x1="500" y1="120" x2="530" y2="120"/>
      <line x1="660" y1="120" x2="690" y2="120"/>
      <line x1="820" y1="120" x2="850" y2="120"/>
      <line x1="980" y1="120" x2="1010" y2="120"/>
    </g>

    <g class="mono" text-anchor="middle">
      <rect class="box s1" x="50"   y="88" width="130" height="64" rx="10"/>
      <text x="115" y="118" class="amber" font-size="12" font-weight="700">INGEST</text>
      <text x="115" y="136" class="dim" font-size="9">docs · repos · video</text>

      <rect class="box s2" x="210"  y="88" width="130" height="64" rx="10"/>
      <text x="275" y="118" class="amber" font-size="12" font-weight="700">PARSE</text>
      <text x="275" y="136" class="dim" font-size="9">tree-sitter chunks</text>

      <rect class="box s3" x="370"  y="88" width="130" height="64" rx="10"/>
      <text x="435" y="118" class="amber" font-size="12" font-weight="700">EMBED</text>
      <text x="435" y="136" class="dim" font-size="9">100K+ vectors</text>

      <rect class="box s4" x="530"  y="88" width="130" height="64" rx="10"/>
      <text x="595" y="118" class="amber" font-size="12" font-weight="700">INDEX</text>
      <text x="595" y="136" class="dim" font-size="9">Qdrant · Pinecone</text>

      <rect class="box s5" x="690"  y="88" width="130" height="64" rx="10"/>
      <text x="755" y="118" class="amber" font-size="12" font-weight="700">RETRIEVE</text>
      <text x="755" y="136" class="dim" font-size="9">semantic search</text>

      <rect class="box s6" x="850"  y="88" width="130" height="64" rx="10"/>
      <text x="915" y="118" class="amber" font-size="11" font-weight="700">ORCHESTRATE</text>
      <text x="915" y="136" class="dim" font-size="9">LangGraph · MCP</text>

      <rect class="box s7" x="1010" y="88" width="130" height="64" rx="10"/>
      <text x="1075" y="118" class="amber" font-size="12" font-weight="700">SHIP</text>
      <text x="1075" y="136" class="dim" font-size="9">Docker · CI/CD</text>
    </g>

    <g class="packet">
      <circle cx="60" cy="120" r="7" fill="#FFB000" opacity=".35" filter="url(#dotGlow)"/>
      <circle cx="60" cy="120" r="3.5" fill="#FFC94A"/>
    </g>

    <text x="40" y="196" class="mono dim" font-size="10">one packet, end to end — the same loop behind EngineerBrain, SmartGenie and the Nervesparks platforms</text>
  </g>
</svg>
