<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 190" width="1120" height="190" role="img" aria-label="How I build: ingest, chunk, embed, index, retrieve, agents, ship">
  <title>Build pipeline</title>

  <defs>
    <filter id="dotGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: "JetBrains Mono","IBM Plex Mono","SFMono-Regular",Consolas,monospace; }
    .amber{ fill:#FFB000; } .ember{ fill:#FF7A18; } .bone{ fill:#F0E2CC; } .dim{ fill:#8A7A66; }
    .box { fill:#12100D; stroke:#3A2E22; stroke-width:1.5; }
    .wire2 { stroke:#FF7A18; stroke-opacity:.5; stroke-width:1.4; stroke-dasharray:4 6; animation: flow2 2.2s linear infinite; }

    @keyframes flow2 { to { stroke-dashoffset: -100; } }
    @keyframes travel { 0% { transform: translateX(0); } 100% { transform: translateX(1070px); } }
    @keyframes hit { 0% { stroke:#3A2E22; } 3% { stroke:#FFB000; } 14% { stroke:#3A2E22; } 100% { stroke:#3A2E22; } }
    @keyframes blink2 { 0%,49%{opacity:1} 50%,100%{opacity:0} }

    .packet { animation: travel 7s linear infinite; }
    .box { animation: hit 7s linear infinite; }
    .s1{animation-delay:.36s} .s2{animation-delay:1.4s} .s3{animation-delay:2.45s} .s4{animation-delay:3.5s}
    .s5{animation-delay:4.55s} .s6{animation-delay:5.6s} .s7{animation-delay:6.65s}
    .cur { animation: blink2 1.1s steps(1) infinite; }
    @media (prefers-reduced-motion: reduce){ .packet,.box,.wire2,.cur{animation:none} .packet{opacity:0} }
  </style>

  <text x="15" y="24" class="mono" font-size="13"><tspan class="dim">~$ </tspan><tspan class="bone">cat how-i-build.txt</tspan><tspan class="ember cur"> ▮</tspan></text>

  <g class="wire2">
    <line x1="145" y1="94" x2="175" y2="94"/>
    <line x1="305" y1="94" x2="335" y2="94"/>
    <line x1="465" y1="94" x2="495" y2="94"/>
    <line x1="625" y1="94" x2="655" y2="94"/>
    <line x1="785" y1="94" x2="815" y2="94"/>
    <line x1="945" y1="94" x2="975" y2="94"/>
  </g>

  <g class="mono" text-anchor="middle">
    <rect class="box s1" x="15"  y="62" width="130" height="64" rx="10"/>
    <text x="80" y="92" class="amber" font-size="12" font-weight="700">INGEST</text>
    <text x="80" y="110" class="dim" font-size="9">docs · repos · video</text>

    <rect class="box s2" x="175" y="62" width="130" height="64" rx="10"/>
    <text x="240" y="92" class="amber" font-size="12" font-weight="700">PARSE</text>
    <text x="240" y="110" class="dim" font-size="9">tree-sitter chunks</text>

    <rect class="box s3" x="335" y="62" width="130" height="64" rx="10"/>
    <text x="400" y="92" class="amber" font-size="12" font-weight="700">EMBED</text>
    <text x="400" y="110" class="dim" font-size="9">100K+ vectors</text>

    <rect class="box s4" x="495" y="62" width="130" height="64" rx="10"/>
    <text x="560" y="92" class="amber" font-size="12" font-weight="700">INDEX</text>
    <text x="560" y="110" class="dim" font-size="9">Qdrant · Pinecone</text>

    <rect class="box s5" x="655" y="62" width="130" height="64" rx="10"/>
    <text x="720" y="92" class="amber" font-size="12" font-weight="700">RETRIEVE</text>
    <text x="720" y="110" class="dim" font-size="9">semantic search</text>

    <rect class="box s6" x="815" y="62" width="130" height="64" rx="10"/>
    <text x="880" y="92" class="amber" font-size="12" font-weight="700">ORCHESTRATE</text>
    <text x="880" y="110" class="dim" font-size="9">LangGraph · MCP</text>

    <rect class="box s7" x="975" y="62" width="130" height="64" rx="10"/>
    <text x="1040" y="92" class="amber" font-size="12" font-weight="700">SHIP</text>
    <text x="1040" y="110" class="dim" font-size="9">Docker · CI/CD</text>
  </g>

  <g class="packet">
    <circle cx="25" cy="94" r="7" fill="#FFB000" opacity=".35" filter="url(#dotGlow)"/>
    <circle cx="25" cy="94" r="3.5" fill="#FFC94A"/>
  </g>

  <text x="15" y="170" class="mono dim" font-size="10">one packet, end to end — the same loop behind EngineerBrain, SmartGenie and the Nervesparks platforms</text>
</svg>
