<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="Work experience at Zuvees and Nervesparks">
  <title>Experience log</title>

  <defs>
    <pattern id="gridE" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#2A211A" stroke-width="1"/>
    </pattern>
    <radialGradient id="bloomE" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF7A18" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#FF7A18" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frameE"><rect width="1200" height="500" rx="16"/></clipPath>
  </defs>

  <style>
    .mono { font-family: "JetBrains Mono","IBM Plex Mono","SFMono-Regular",Consolas,monospace; }
    .amber { fill:#FFB000; } .ember { fill:#FF7A18; } .bone { fill:#F0E2CC; } .dim { fill:#8A7A66; }
    @keyframes slideE { from { opacity:0; transform: translateX(-10px); } to { opacity:1; transform: translateX(0); } }
    @keyframes blinkE { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    @keyframes pulseE { 0%,100%{opacity:1} 50%{opacity:.3} }
    .e1{animation:slideE .5s ease-out .12s both} .e2{animation:slideE .5s ease-out .26s both} .e3{animation:slideE .5s ease-out .40s both}
    .cur { animation: blinkE 1.1s steps(1) infinite; }
    .now { animation: pulseE 2s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce){ .e1,.e2,.e3,.cur,.now{animation:none} }
  </style>

  <g clip-path="url(#frameE)">
    <rect width="1200" height="500" fill="#0F0D0B"/>
    <rect width="1200" height="500" fill="url(#gridE)" opacity="0.55"/>
    <ellipse cx="1020" cy="440" rx="360" ry="240" fill="url(#bloomE)"/>
    <rect width="1200" height="500" fill="none" stroke="#2A211A" stroke-width="2" rx="16"/>
    <rect x="0" y="0" width="4" height="500" class="ember" opacity="0.8"/>

    <text x="40" y="60" class="mono" font-size="15"><tspan class="dim">~$ </tspan><tspan class="bone">git log --author=saurabh --oneline</tspan><tspan class="amber cur"> ▮</tspan></text>
    <line x1="40" y1="78" x2="1160" y2="78" stroke="#2A211A" stroke-width="1.5"/>

    <!-- entry 1 -->
    <g class="e1">
      <rect x="40" y="100" width="1120" height="118" rx="10" fill="#12100D" stroke="#3A2E22" stroke-width="1.5"/>
      <rect x="40" y="100" width="3.5" height="118" rx="2" fill="#FFB000"/>
      <circle class="now" cx="72" cy="134" r="4" fill="#FFB000"/>
      <text x="86" y="138" class="mono amber" font-size="12.5" font-weight="700">2026.06 →</text>
      <text x="72" y="160" class="mono bone" font-size="12" font-weight="700">Zuvees</text>
      <text x="72" y="178" class="mono dim" font-size="10.5">SDE 1 · Bengaluru</text>
      <text x="330" y="132" class="mono bone" font-size="12.5">Occasion-reminder engine across 25+ occasions with personalized email</text>
      <text x="330" y="154" class="mono bone" font-size="12.5">campaigns → <tspan class="amber" font-weight="700">+30% repeat purchases</tspan>. Rebuilt the storefront UI and</text>
      <text x="330" y="176" class="mono bone" font-size="12.5">component architecture → <tspan class="amber" font-weight="700">+40% engagement</tspan>. Took the mobile app,</text>
      <text x="330" y="198" class="mono bone" font-size="12.5">backend services and analytics integration from zero.</text>
    </g>

    <!-- entry 2 -->
    <g class="e2">
      <rect x="40" y="234" width="1120" height="118" rx="10" fill="#12100D" stroke="#3A2E22" stroke-width="1.5"/>
      <rect x="40" y="234" width="3.5" height="118" rx="2" fill="#FF7A18"/>
      <text x="72" y="268" class="mono ember" font-size="12.5" font-weight="700">2025.12 – 2026.05</text>
      <text x="72" y="292" class="mono bone" font-size="12" font-weight="700">Zuvees</text>
      <text x="72" y="310" class="mono dim" font-size="10.5">SDE Intern</text>
      <text x="330" y="266" class="mono bone" font-size="12.5">Microservices for the gifting platform serving 3000+ monthly users.</text>
      <text x="330" y="288" class="mono bone" font-size="12.5">Async queue processing for unsubscribes → <tspan class="amber" font-weight="700">−40% API latency</tspan>.</text>
      <text x="330" y="310" class="mono bone" font-size="12.5">Multi-container Docker setup → <tspan class="amber" font-weight="700">−70% environment setup time</tspan>.</text>
      <text x="330" y="332" class="mono dim" font-size="12.5">Integrated frontend and backend APIs end to end.</text>
    </g>

    <!-- entry 3 -->
    <g class="e3">
      <rect x="40" y="368" width="1120" height="118" rx="10" fill="#12100D" stroke="#3A2E22" stroke-width="1.5"/>
      <rect x="40" y="368" width="3.5" height="118" rx="2" fill="#FF7A18"/>
      <text x="72" y="402" class="mono ember" font-size="12.5" font-weight="700">2025.03 – 2025.08</text>
      <text x="72" y="426" class="mono bone" font-size="12" font-weight="700">Nervesparks</text>
      <text x="72" y="444" class="mono dim" font-size="10.5">SWE Intern</text>
      <text x="330" y="400" class="mono bone" font-size="12.5">Document-processing platform (React + FastAPI) generating mind maps and</text>
      <text x="330" y="422" class="mono bone" font-size="12.5">200+ question formats → <tspan class="amber" font-weight="700">+65% retention for 7,000+ learners</tspan>. Offline</text>
      <text x="330" y="444" class="mono bone" font-size="12.5">React Native app running Llama.cpp on-device → <tspan class="amber" font-weight="700">80% faster loads</tspan>.</text>
      <text x="330" y="466" class="mono bone" font-size="12.5">Flask translation pipeline across <tspan class="amber" font-weight="700">50+ languages</tspan>, 1,000+ documents.</text>
    </g>
  </g>
</svg>
