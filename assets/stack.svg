<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Technical stack">
  <title>Technical stack</title>

  <defs>
    <pattern id="gridS" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#2A211A" stroke-width="1"/>
    </pattern>
    <radialGradient id="bloomS" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF7A18" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FF7A18" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frameS"><rect width="1200" height="300" rx="16"/></clipPath>
  </defs>

  <style>
    .mono { font-family: "JetBrains Mono","IBM Plex Mono","SFMono-Regular",Consolas,monospace; }
    .amber { fill:#FFB000; } .ember { fill:#FF7A18; } .bone { fill:#F0E2CC; } .dim { fill:#8A7A66; }
    .pill { fill:#17130F; stroke:#3A2E22; stroke-width:1.4; }
    .plabel { font-size:11; font-weight:600; text-anchor:middle; fill:#FFB000; }
    @keyframes rowup { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }
    @keyframes blinkS { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    .g1{animation:rowup .5s ease-out .10s both} .g2{animation:rowup .5s ease-out .25s both}
    .g3{animation:rowup .5s ease-out .40s both} .g4{animation:rowup .5s ease-out .55s both}
    .cur { animation: blinkS 1.1s steps(1) infinite; }
    @media (prefers-reduced-motion: reduce){ .g1,.g2,.g3,.g4,.cur{animation:none} }
  </style>

  <g clip-path="url(#frameS)">
    <rect width="1200" height="300" fill="#0F0D0B"/>
    <rect width="1200" height="300" fill="url(#gridS)" opacity="0.55"/>
    <ellipse cx="900" cy="60" rx="360" ry="220" fill="url(#bloomS)"/>
    <rect width="1200" height="300" fill="none" stroke="#2A211A" stroke-width="2" rx="16"/>
    <rect x="0" y="0" width="4" height="300" class="ember" opacity="0.8"/>

    <text x="40" y="46" class="mono" font-size="15"><tspan class="dim">~$ </tspan><tspan class="bone">ls ./stack</tspan><tspan class="amber cur"> ▮</tspan></text>
    <line x1="40" y1="62" x2="1160" y2="62" stroke="#2A211A" stroke-width="1.5"/>

    <g class="mono g1">
      <text x="40" y="100" class="bone" font-size="12" font-weight="700">languages</text>
      <rect class="pill" x="210" y="84" width="62" height="26" rx="13"/><text x="241" y="101" class="plabel">Python</text>
      <rect class="pill" x="282" y="84" width="42" height="26" rx="13"/><text x="303" y="101" class="plabel">C++</text>
      <rect class="pill" x="334" y="84" width="88" height="26" rx="13"/><text x="378" y="101" class="plabel">TypeScript</text>
      <rect class="pill" x="432" y="84" width="88" height="26" rx="13"/><text x="476" y="101" class="plabel">JavaScript</text>
      <rect class="pill" x="530" y="84" width="42" height="26" rx="13"/><text x="551" y="101" class="plabel">SQL</text>
      <rect class="pill" x="582" y="84" width="30" height="26" rx="13"/><text x="597" y="101" class="plabel">C</text>
    </g>

    <g class="mono g2">
      <text x="40" y="158" class="bone" font-size="12" font-weight="700">genai</text>
      <rect class="pill" x="210" y="142" width="82" height="26" rx="13"/><text x="251" y="159" class="plabel">LangGraph</text>
      <rect class="pill" x="302" y="142" width="82" height="26" rx="13"/><text x="343" y="159" class="plabel">LangChain</text>
      <rect class="pill" x="394" y="142" width="42" height="26" rx="13"/><text x="415" y="159" class="plabel">RAG</text>
      <rect class="pill" x="446" y="142" width="42" height="26" rx="13"/><text x="467" y="159" class="plabel">MCP</text>
      <rect class="pill" x="498" y="142" width="66" height="26" rx="13"/><text x="531" y="159" class="plabel">Agents</text>
      <rect class="pill" x="574" y="142" width="62" height="26" rx="13"/><text x="605" y="159" class="plabel">Qdrant</text>
      <rect class="pill" x="646" y="142" width="76" height="26" rx="13"/><text x="684" y="159" class="plabel">Pinecone</text>
      <rect class="pill" x="732" y="142" width="96" height="26" rx="13"/><text x="780" y="159" class="plabel">Fine-tuning</text>
      <rect class="pill" x="838" y="142" width="50" height="26" rx="13"/><text x="863" y="159" class="plabel">LLMs</text>
    </g>

    <g class="mono g3">
      <text x="40" y="216" class="bone" font-size="12" font-weight="700">web</text>
      <rect class="pill" x="210" y="200" width="56" height="26" rx="13"/><text x="238" y="217" class="plabel">React</text>
      <rect class="pill" x="276" y="200" width="68" height="26" rx="13"/><text x="310" y="217" class="plabel">Next.js</text>
      <rect class="pill" x="354" y="200" width="68" height="26" rx="13"/><text x="388" y="217" class="plabel">Node.js</text>
      <rect class="pill" x="432" y="200" width="68" height="26" rx="13"/><text x="466" y="217" class="plabel">Express</text>
      <rect class="pill" x="510" y="200" width="68" height="26" rx="13"/><text x="544" y="217" class="plabel">FastAPI</text>
      <rect class="pill" x="588" y="200" width="56" height="26" rx="13"/><text x="616" y="217" class="plabel">Flask</text>
      <rect class="pill" x="654" y="200" width="82" height="26" rx="13"/><text x="695" y="217" class="plabel">REST APIs</text>
      <rect class="pill" x="746" y="200" width="102" height="26" rx="13"/><text x="797" y="217" class="plabel">React Native</text>
    </g>

    <g class="mono g4">
      <text x="40" y="274" class="bone" font-size="12" font-weight="700">data · infra</text>
      <rect class="pill" x="210" y="258" width="88" height="26" rx="13"/><text x="254" y="275" class="plabel">PostgreSQL</text>
      <rect class="pill" x="308" y="258" width="70" height="26" rx="13"/><text x="343" y="275" class="plabel">MongoDB</text>
      <rect class="pill" x="388" y="258" width="56" height="26" rx="13"/><text x="416" y="275" class="plabel">Redis</text>
      <rect class="pill" x="454" y="258" width="76" height="26" rx="13"/><text x="492" y="275" class="plabel">RabbitMQ</text>
      <rect class="pill" x="540" y="258" width="62" height="26" rx="13"/><text x="571" y="275" class="plabel">Docker</text>
      <rect class="pill" x="612" y="258" width="46" height="26" rx="13"/><text x="635" y="275" class="plabel">AWS</text>
      <rect class="pill" x="668" y="258" width="56" height="26" rx="13"/><text x="696" y="275" class="plabel">CI/CD</text>
      <rect class="pill" x="734" y="258" width="42" height="26" rx="13"/><text x="755" y="275" class="plabel">Git</text>
    </g>
  </g>
</svg>
