<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="About Saurabh Jaiswar and featured work">
  <title>About — Saurabh Jaiswar</title>

  <defs>
    <pattern id="gridI" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#2A211A" stroke-width="1"/>
    </pattern>
    <radialGradient id="bloomI" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF7A18" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FF7A18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hexI" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFC94A"/>
      <stop offset="100%" stop-color="#FF7A18"/>
    </linearGradient>
    <filter id="softI" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="frameI"><rect width="1200" height="480" rx="16"/></clipPath>
  </defs>

  <style>
    .mono { font-family: "JetBrains Mono","IBM Plex Mono","SFMono-Regular",Consolas,monospace; }
    .amber { fill:#FFB000; } .ember { fill:#FF7A18; } .bone { fill:#F0E2CC; } .dim { fill:#8A7A66; }
    @keyframes fadeI { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform: translateY(0); } }
    @keyframes spinI { to { transform: rotate(360deg); } }
    @keyframes blinkI { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    @keyframes pingI { 0%,100%{opacity:1} 50%{opacity:.25} }
    .a1{animation:fadeI .5s ease-out .10s both} .a2{animation:fadeI .5s ease-out .22s both}
    .a3{animation:fadeI .5s ease-out .34s both} .a4{animation:fadeI .5s ease-out .46s both}
    .a5{animation:fadeI .5s ease-out .58s both} .a6{animation:fadeI .5s ease-out .70s both}
    .hexr { animation: spinI 18s linear infinite; transform-origin: 210px 128px; }
    .cur { animation: blinkI 1.1s steps(1) infinite; }
    .live { animation: pingI 2s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce){ .a1,.a2,.a3,.a4,.a5,.a6,.hexr,.cur,.live{animation:none} }
  </style>

  <g clip-path="url(#frameI)">
    <rect width="1200" height="480" fill="#0F0D0B"/>
    <rect width="1200" height="480" fill="url(#gridI)" opacity="0.55"/>
    <ellipse cx="180" cy="120" rx="340" ry="260" fill="url(#bloomI)"/>
    <rect width="1200" height="480" fill="none" stroke="#2A211A" stroke-width="2" rx="16"/>
    <rect x="0" y="0" width="4" height="480" class="ember" opacity="0.8"/>

    <!-- left: identity block -->
    <g class="a1">
      <rect x="40" y="40" width="340" height="400" rx="12" fill="#17130F" stroke="#2A211A" stroke-width="1.5"/>
      <rect x="40" y="40" width="340" height="30" rx="12" fill="#1E1813"/>
      <rect x="40" y="58" width="340" height="12" fill="#1E1813"/>
      <circle cx="60" cy="55" r="4.5" fill="#FF7A18"/>
      <circle cx="76" cy="55" r="4.5" fill="#FFB000"/>
      <circle cx="92" cy="55" r="4.5" fill="#3F352B"/>
      <text x="210" y="59" class="mono dim" font-size="10" text-anchor="middle">whoami.sh</text>

      <g class="hexr">
        <circle cx="210" cy="128" r="46" fill="none" stroke="#FFB000" stroke-opacity=".28" stroke-width="1" stroke-dasharray="3 8"/>
      </g>
      <circle cx="210" cy="128" r="38" fill="#FF7A18" opacity=".15" filter="url(#softI)"/>
      <path d="M210 94 L239 111 L239 145 L210 162 L181 145 L181 111 Z" fill="#12100D" stroke="url(#hexI)" stroke-width="2"/>
      <text x="210" y="136" class="mono" font-size="23" font-weight="700" text-anchor="middle" fill="url(#hexI)">SJ</text>

      <text x="210" y="200" class="mono bone" font-size="16" font-weight="700" letter-spacing="1.5" text-anchor="middle">SAURABH JAISWAR</text>
      <text x="210" y="220" class="mono ember" font-size="10" letter-spacing="2" text-anchor="middle">SDE 1 · ZUVEES</text>
      <line x1="70" y1="244" x2="350" y2="244" stroke="#2A211A" stroke-width="1.5"/>

      <g class="mono" font-size="11">
        <text x="70" y="274" class="dim">locale</text><text x="164" y="274" class="bone">Bengaluru, India</text>
        <text x="70" y="302" class="dim">studies</text><text x="164" y="302" class="bone">B.Tech CSE, IIIT Vadodara</text>
        <text x="164" y="318" class="dim">class of 2026</text>
        <text x="70" y="346" class="dim">solved</text><text x="164" y="346" class="amber">3500+ problems</text>
        <text x="70" y="374" class="dim">peak</text><text x="164" y="374" class="amber">2160 LC · 1804 CC · 1645 CF</text>
        <text x="70" y="402" class="dim">reach</text><text x="164" y="402" class="bone">sesaurabh8052@gmail.com</text>
      </g>
      <circle class="live" cx="74" cy="426" r="3.5" fill="#FFB000"/>
      <text x="86" y="430" class="mono amber" font-size="10.5">open to interesting problems</text>
    </g>

    <!-- right: about -->
    <text x="424" y="64" class="mono a1" font-size="15"><tspan class="dim">~$ </tspan><tspan class="bone">cat about.md</tspan><tspan class="amber cur"> ▮</tspan></text>
    <line x1="424" y1="82" x2="1160" y2="82" stroke="#2A211A" stroke-width="1.5"/>

    <g class="mono" font-size="13.5">
      <g class="a2">
        <text x="424" y="118" class="bone">I build systems that think a little for themselves — multi-agent pipelines,</text>
        <text x="424" y="140" class="bone">retrieval layers, and the web apps that put them in front of real users.</text>
        <text x="424" y="162" class="bone">Currently an <tspan class="amber" font-weight="700">SDE 1 at Zuvees</tspan> in Bengaluru, finishing my <tspan class="amber" font-weight="700">B.Tech in CSE</tspan></text>
        <text x="424" y="184" class="bone">at <tspan class="amber" font-weight="700">IIIT Vadodara</tspan>.</text>
      </g>

      <g class="a3">
        <text x="424" y="222" class="bone">Before the AI work I spent three years on competitive programming, and</text>
        <text x="424" y="244" class="bone">it still shapes how I write code: <tspan class="amber" font-weight="700">3500+ problems solved</tspan>, LeetCode</text>
        <text x="424" y="266" class="bone"><tspan class="amber" font-weight="700">Guardian (2160)</tspan>, <tspan class="amber" font-weight="700">ICPC Regionalist 2025</tspan>. The habit of hunting for</text>
        <text x="424" y="288" class="bone">the tight solution transfers well to production.</text>
      </g>

      <g class="a4">
        <text x="424" y="326" class="ember" font-weight="700">Right now<tspan class="dim" font-weight="400"> — orchestrating agents with LangGraph, chasing lower</tspan></text>
        <text x="424" y="348" class="dim">p99s, and shipping to 3000+ users.</text>
      </g>
    </g>

    <text x="424" y="390" class="mono dim" font-size="10" letter-spacing="3">FEATURED WORK</text>

    <g class="a5">
      <rect x="424" y="402" width="356" height="56" rx="9" fill="#12100D" stroke="#3A2E22" stroke-width="1.5"/>
      <text x="442" y="424" class="mono amber" font-size="13" font-weight="700">EngineerBrain</text>
      <text x="442" y="442" class="mono dim" font-size="9.5">15+ agents · 100K-chunk code index · LangGraph</text>
    </g>
    <g class="a6">
      <rect x="800" y="402" width="356" height="56" rx="9" fill="#12100D" stroke="#3A2E22" stroke-width="1.5"/>
      <text x="818" y="424" class="mono amber" font-size="13" font-weight="700">SmartGenie AI</text>
      <text x="818" y="442" class="mono dim" font-size="9.5">RAG video summarization · 200+ users · MERN</text>
    </g>
  </g>
</svg>
