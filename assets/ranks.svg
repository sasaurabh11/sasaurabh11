<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Competitive programming ratings">
  <title>Competitive programming ratings</title>

  <defs>
    <linearGradient id="barG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF7A18"/>
      <stop offset="100%" stop-color="#FFC94A"/>
    </linearGradient>
    <pattern id="gridR" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#2A211A" stroke-width="1"/>
    </pattern>
    <radialGradient id="bloomR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF7A18" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FF7A18" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frameR"><rect width="1200" height="300" rx="16"/></clipPath>
  </defs>

  <style>
    .mono { font-family: "JetBrains Mono","IBM Plex Mono","SFMono-Regular",Consolas,monospace; }
    .amber { fill:#FFB000; } .ember { fill:#FF7A18; } .bone { fill:#F0E2CC; } .dim { fill:#8A7A66; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes fade { from { opacity:0; } to { opacity:1; } }
    @keyframes tick { 0%,100% { opacity:.9; } 50% { opacity:.35; } }
    .bar { transform-box: fill-box; transform-origin: left center; animation: grow 1.3s cubic-bezier(.2,.8,.2,1) both; }
    .b1{animation-delay:.15s} .b2{animation-delay:.35s} .b3{animation-delay:.55s}
    .f1{animation:fade .5s ease-out .5s both} .f2{animation:fade .5s ease-out .7s both} .f3{animation:fade .5s ease-out .9s both}
    .head{animation:tick 2.4s ease-in-out infinite}
    @media (prefers-reduced-motion: reduce){ .bar,.f1,.f2,.f3,.head{animation:none} .bar{transform:none} }
  </style>

  <g clip-path="url(#frameR)">
    <rect width="1200" height="300" fill="#0F0D0B"/>
    <rect width="1200" height="300" fill="url(#gridR)" opacity="0.55"/>
    <ellipse cx="1000" cy="150" rx="380" ry="220" fill="url(#bloomR)"/>
    <rect width="1200" height="300" fill="none" stroke="#2A211A" stroke-width="2" rx="16"/>
    <rect x="0" y="0" width="4" height="300" class="ember" opacity="0.8"/>

    <text x="40" y="46" class="mono" font-size="15">
      <tspan class="dim">~$ </tspan><tspan class="bone">./ranks --all</tspan><tspan class="ember head"> ▮</tspan>
    </text>
    <line x1="40" y1="64" x2="1160" y2="64" stroke="#2A211A" stroke-width="1.5"/>

    <!-- LeetCode 2160/2500 * 640 = 553 -->
    <g>
      <text x="40" y="112" class="mono bone" font-size="14" font-weight="600">LeetCode</text>
      <text x="40" y="130" class="mono dim" font-size="10">Guardian · top 1%</text>
      <text x="230" y="122" class="mono amber" font-size="28" font-weight="700">2160</text>
      <rect x="380" y="108" width="640" height="12" rx="6" fill="#1B1611"/>
      <rect class="bar b1" x="380" y="108" width="553" height="12" rx="6" fill="url(#barG)"/>
      <text x="1040" y="118" class="mono f1 dim" font-size="11">8000 / 789k</text>
      <text x="380" y="140" class="mono f1 dim" font-size="10">1400+ problems solved</text>
    </g>

    <!-- CodeChef 1804 -> 462 -->
    <g>
      <text x="40" y="192" class="mono bone" font-size="14" font-weight="600">CodeChef</text>
      <text x="40" y="210" class="mono dim" font-size="10">4-star</text>
      <text x="230" y="202" class="mono amber" font-size="28" font-weight="700">1804</text>
      <rect x="380" y="188" width="640" height="12" rx="6" fill="#1B1611"/>
      <rect class="bar b2" x="380" y="188" width="462" height="12" rx="6" fill="url(#barG)"/>
      <text x="1040" y="198" class="mono f2 dim" font-size="11">4938 / 530k</text>
      <text x="380" y="220" class="mono f2 dim" font-size="10">best contest rank 80 / 5000+</text>
    </g>

    <!-- Codeforces 1645 -> 421 -->
    <g>
      <text x="40" y="272" class="mono bone" font-size="14" font-weight="600">Codeforces</text>
      <text x="40" y="290" class="mono dim" font-size="10">Expert</text>
      <text x="230" y="282" class="mono amber" font-size="28" font-weight="700">1645</text>
      <rect x="380" y="268" width="640" height="12" rx="6" fill="#1B1611"/>
      <rect class="bar b3" x="380" y="268" width="421" height="12" rx="6" fill="url(#barG)"/>
      <text x="1040" y="278" class="mono f3 dim" font-size="11">9772 / 350k</text>
      <text x="380" y="300" class="mono f3 dim" font-size="10">best round rank 209 / 32000+</text>
    </g>
  </g>
</svg>
