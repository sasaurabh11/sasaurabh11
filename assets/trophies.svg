<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" role="img" aria-label="Contest achievements">
  <title>Contest achievements</title>

  <defs>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB000" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFB000" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFB000" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c1"><rect x="16" y="24" width="204" height="152" rx="12"/></clipPath>
    <clipPath id="c2"><rect x="236" y="24" width="204" height="152" rx="12"/></clipPath>
    <clipPath id="c3"><rect x="456" y="24" width="204" height="152" rx="12"/></clipPath>
    <clipPath id="c4"><rect x="676" y="24" width="204" height="152" rx="12"/></clipPath>
  </defs>

  <style>
    .mono { font-family: "JetBrains Mono","IBM Plex Mono","SFMono-Regular",Consolas,monospace; }
    .amber{ fill:#FFB000; } .ember{ fill:#FF7A18; } .bone{ fill:#F0E2CC; } .dim{ fill:#8A7A66; }
    @keyframes slide { 0% { transform: translateX(-240px); } 55%,100% { transform: translateX(240px); } }
    @keyframes pop { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }
    .sh { animation: slide 4.5s ease-in-out infinite; }
    .p1{animation:pop .5s ease-out .1s both} .p2{animation:pop .5s ease-out .25s both}
    .p3{animation:pop .5s ease-out .4s both} .p4{animation:pop .5s ease-out .55s both}
    @media (prefers-reduced-motion: reduce){ .sh,.p1,.p2,.p3,.p4{animation:none} .sh{opacity:0} }
  </style>

  <rect width="900" height="200" fill="none"/>

  <g class="p1">
    <rect x="16" y="24" width="204" height="152" rx="12" fill="#12100D" stroke="#3A2E22" stroke-width="1.5"/>
    <g clip-path="url(#c1)"><rect class="sh" x="16" y="24" width="204" height="152" fill="url(#shine)" style="animation-delay:0s"/></g>
    <text x="118" y="66" class="mono ember" font-size="20" text-anchor="middle">◆</text>
    <text x="118" y="102" class="mono amber" font-size="19" font-weight="700" text-anchor="middle">ICPC 2025</text>
    <text x="118" y="126" class="mono bone" font-size="12" text-anchor="middle">Regionalist</text>
    <text x="118" y="150" class="mono dim" font-size="9.5" text-anchor="middle">top teams in India</text>
  </g>

  <g class="p2">
    <rect x="236" y="24" width="204" height="152" rx="12" fill="#12100D" stroke="#3A2E22" stroke-width="1.5"/>
    <g clip-path="url(#c2)"><rect class="sh" x="236" y="24" width="204" height="152" fill="url(#shine)" style="animation-delay:.6s"/></g>
    <text x="338" y="66" class="mono ember" font-size="20" text-anchor="middle">▲</text>
    <text x="338" y="102" class="mono amber" font-size="19" font-weight="700" text-anchor="middle">RANK 209</text>
    <text x="338" y="126" class="mono bone" font-size="12" text-anchor="middle">Codeforces R1054</text>
    <text x="338" y="150" class="mono dim" font-size="9.5" text-anchor="middle">of 32,000+</text>
  </g>

  <g class="p3">
    <rect x="456" y="24" width="204" height="152" rx="12" fill="#12100D" stroke="#3A2E22" stroke-width="1.5"/>
    <g clip-path="url(#c3)"><rect class="sh" x="456" y="24" width="204" height="152" fill="url(#shine)" style="animation-delay:1.2s"/></g>
    <text x="558" y="66" class="mono ember" font-size="20" text-anchor="middle">★</text>
    <text x="558" y="102" class="mono amber" font-size="19" font-weight="700" text-anchor="middle">RANK 80</text>
    <text x="558" y="126" class="mono bone" font-size="12" text-anchor="middle">CodeChef Starters 110</text>
    <text x="558" y="150" class="mono dim" font-size="9.5" text-anchor="middle">of 5,000+</text>
  </g>

  <g class="p4">
    <rect x="676" y="24" width="204" height="152" rx="12" fill="#12100D" stroke="#3A2E22" stroke-width="1.5"/>
    <g clip-path="url(#c4)"><rect class="sh" x="676" y="24" width="204" height="152" fill="url(#shine)" style="animation-delay:1.8s"/></g>
    <text x="778" y="66" class="mono ember" font-size="20" text-anchor="middle">◇</text>
    <text x="778" y="102" class="mono amber" font-size="19" font-weight="700" text-anchor="middle">RANK 1384</text>
    <text x="778" y="126" class="mono bone" font-size="12" text-anchor="middle">Meta Hacker Cup R1</text>
    <text x="778" y="150" class="mono dim" font-size="9.5" text-anchor="middle">of 22,000+</text>
  </g>
</svg>
