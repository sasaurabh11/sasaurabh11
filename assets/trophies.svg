<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-label="Contest achievements">
  <title>Contest achievements</title>

  <defs>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB000" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFB000" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFB000" stop-opacity="0"/>
    </linearGradient>
    <pattern id="gridT" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#2A211A" stroke-width="1"/>
    </pattern>
    <radialGradient id="bloomT" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF7A18" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FF7A18" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frameT"><rect width="1200" height="230" rx="16"/></clipPath>
    <clipPath id="c1"><rect x="40" y="62" width="262" height="140" rx="10"/></clipPath>
    <clipPath id="c2"><rect x="318" y="62" width="262" height="140" rx="10"/></clipPath>
    <clipPath id="c3"><rect x="596" y="62" width="262" height="140" rx="10"/></clipPath>
    <clipPath id="c4"><rect x="874" y="62" width="262" height="140" rx="10"/></clipPath>
  </defs>

  <style>
    .mono { font-family: "JetBrains Mono","IBM Plex Mono","SFMono-Regular",Consolas,monospace; }
    .amber { fill:#FFB000; } .ember { fill:#FF7A18; } .bone { fill:#F0E2CC; } .dim { fill:#8A7A66; }
    @keyframes slide { 0% { transform: translateX(-290px); } 55%,100% { transform: translateX(290px); } }
    @keyframes pop { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }
    .sh { animation: slide 4.5s ease-in-out infinite; }
    .p1{animation:pop .5s ease-out .1s both} .p2{animation:pop .5s ease-out .25s both}
    .p3{animation:pop .5s ease-out .4s both} .p4{animation:pop .5s ease-out .55s both}
    @media (prefers-reduced-motion: reduce){ .sh,.p1,.p2,.p3,.p4{animation:none} .sh{opacity:0} }
  </style>

  <g clip-path="url(#frameT)">
    <rect width="1200" height="230" fill="#0F0D0B"/>
    <rect width="1200" height="230" fill="url(#gridT)" opacity="0.55"/>
    <ellipse cx="300" cy="140" rx="380" ry="200" fill="url(#bloomT)"/>
    <rect width="1200" height="230" fill="none" stroke="#2A211A" stroke-width="2" rx="16"/>
    <rect x="0" y="0" width="4" height="230" class="ember" opacity="0.8"/>

    <text x="40" y="44" class="mono" font-size="15"><tspan class="dim">~$ </tspan><tspan class="bone">ls ./trophies</tspan></text>

    <g class="p1">
      <rect x="40" y="62" width="262" height="140" rx="10" fill="#12100D" stroke="#3A2E22" stroke-width="1.5"/>
      <g clip-path="url(#c1)"><rect class="sh" x="40" y="62" width="262" height="140" fill="url(#shine)" style="animation-delay:0s"/></g>
      <text x="171" y="100" class="mono ember" font-size="20" text-anchor="middle">◆</text>
      <text x="171" y="134" class="mono amber" font-size="19" font-weight="700" text-anchor="middle">ICPC 2025</text>
      <text x="171" y="158" class="mono bone" font-size="12" text-anchor="middle">Regionalist</text>
      <text x="171" y="180" class="mono dim" font-size="9.5" text-anchor="middle">top teams in India</text>
    </g>

    <g class="p2">
      <rect x="318" y="62" width="262" height="140" rx="10" fill="#12100D" stroke="#3A2E22" stroke-width="1.5"/>
      <g clip-path="url(#c2)"><rect class="sh" x="318" y="62" width="262" height="140" fill="url(#shine)" style="animation-delay:.6s"/></g>
      <text x="449" y="100" class="mono ember" font-size="20" text-anchor="middle">▲</text>
      <text x="449" y="134" class="mono amber" font-size="19" font-weight="700" text-anchor="middle">RANK 209</text>
      <text x="449" y="158" class="mono bone" font-size="12" text-anchor="middle">Codeforces R1054</text>
      <text x="449" y="180" class="mono dim" font-size="9.5" text-anchor="middle">of 32,000+</text>
    </g>

    <g class="p3">
      <rect x="596" y="62" width="262" height="140" rx="10" fill="#12100D" stroke="#3A2E22" stroke-width="1.5"/>
      <g clip-path="url(#c3)"><rect class="sh" x="596" y="62" width="262" height="140" fill="url(#shine)" style="animation-delay:1.2s"/></g>
      <text x="727" y="100" class="mono ember" font-size="20" text-anchor="middle">★</text>
      <text x="727" y="134" class="mono amber" font-size="19" font-weight="700" text-anchor="middle">RANK 80</text>
      <text x="727" y="158" class="mono bone" font-size="12" text-anchor="middle">CodeChef Starters 110</text>
      <text x="727" y="180" class="mono dim" font-size="9.5" text-anchor="middle">of 5,000+</text>
    </g>

    <g class="p4">
      <rect x="874" y="62" width="262" height="140" rx="10" fill="#12100D" stroke="#3A2E22" stroke-width="1.5"/>
      <g clip-path="url(#c4)"><rect class="sh" x="874" y="62" width="262" height="140" fill="url(#shine)" style="animation-delay:1.8s"/></g>
      <text x="1005" y="100" class="mono ember" font-size="20" text-anchor="middle">◇</text>
      <text x="1005" y="134" class="mono amber" font-size="19" font-weight="700" text-anchor="middle">RANK 1384</text>
      <text x="1005" y="158" class="mono bone" font-size="12" text-anchor="middle">Meta Hacker Cup R1</text>
      <text x="1005" y="180" class="mono dim" font-size="9.5" text-anchor="middle">of 22,000+</text>
    </g>
  </g>
</svg>
